<div class="modal fade" id="{{ modal_id|default:'confirmModal' }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title|default:"Підтвердження" }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
      </div>
      <div class="modal-body">
        {{ text|default:"Підтвердьте дію." }}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Скасувати</button>
        <button type="submit" class="btn btn-danger">{{ submit_label|default:"Підтвердити" }}</button>
      </div>
    </div>
  </div>
</div>
