{% extends "base.html" %}
{% block title %}{{ title|default:"Пароль" }}{% endblock %}
{% block content %}
<div class="auth-page container">
  <section class="auth-panel">
    <h1>{{ title|default:"Пароль" }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100" type="submit">Продовжити</button>
    </form>
  </section>
</div>
{% endblock %}
