{% extends "base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="auth-page container">
  <section class="auth-panel">
    <div>
      <p class="eyebrow">BookS</p>
      <h1>Вхід</h1>
    </div>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100" type="submit">Увійти</button>
    </form>
    <div class="d-flex justify-content-between small">
      <a href="{% url 'password_reset' %}">Забули пароль?</a>
      <a href="{% url 'books:register' %}">Реєстрація</a>
    </div>
  </section>
</div>
{% endblock %}
